[project]
name = "waylo-backend"
version = "0.1.0"
description = "Waylo — AI travel agent (hackathon MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=0.70",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false
