services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://waylo:waylo@db:5432/waylo
      GIGACHAT_CA_BUNDLE: ""  # в контейнере используется сертификат из certs/
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waylo
      POSTGRES_PASSWORD: waylo
      POSTGRES_DB: waylo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waylo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
